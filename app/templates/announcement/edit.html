{% extends 'layouts/base.html' %}
{% block title %}Edit Announcement{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Edit Announcement</h2>
    <a href="{{ url_for('announcement.manage') }}" class="btn btn-secondary">Cancel</a>
</div>

<div class="card shadow-sm">
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Title *</label>
                <input type="text" name="title" class="form-control"
                       value="{{ ann.title }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Content *</label>
                <textarea name="content" class="form-control"
                          rows="5" required>{{ ann.content }}</textarea>
            </div>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Type</label>
                    <select name="type" class="form-select">
                        {% for key, data in types.items() %}
                        <option value="{{ key }}"
                            {{ 'selected' if ann.type == key }}>
                            {{ data.icon }} {{ data.label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Priority</label>
                    <select name="priority" class="form-select">
                        {% for key, data in priorities.items() %}
                        <option value="{{ key }}"
                            {{ 'selected' if ann.priority == key }}>
                            {{ data.label }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Expires On</label>
                    <input type="date" name="expires_on" class="form-control"
                           value="{{ ann.expires_on or '' }}">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Update</button>
        </form>
    </div>
</div>
{% endblock %}
